name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run pyright
      - run: uv run pytest -m "not chain and not live"
      - name: Python and TypeScript contracts match
        run: uv run python scripts/gen_contract.py --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          PREFLIGHT_OFFLINE: "1"

  localnet:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
      - run: uv sync
      - run: docker pull ghcr.io/raofoundation/subtensor-localnet:devnet
      - name: Every break scenario is diagnosed on a fresh chain
        run: |
          docker rm -f preflight_localnet || true
          uv run pytest tests/localnet -m chain -v

  action-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker pull ghcr.io/raofoundation/subtensor-localnet:devnet
      - name: A healthy localnet subnet passes the gate
        uses: ./
        with:
          fail-on: critical
      - name: Break a miner
        run: uv run preflight local break unserved-axon
      - id: broken
        name: The gate must now fail
        uses: ./
        continue-on-error: true
        with:
          fail-on: high
          start-localnet: "false"
      - run: test "${{ steps.broken.outcome }}" = failure

  action-published:
    # The action as an outside repository uses it: by its public name, not a local path.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: docker pull ghcr.io/raofoundation/subtensor-localnet:devnet
      - id: gate
        uses: Adwaitbytes/preflight@main
        with:
          fail-on: critical
      - run: echo "Published action passed with ${{ steps.gate.outputs.findings }} failing hotkeys"
