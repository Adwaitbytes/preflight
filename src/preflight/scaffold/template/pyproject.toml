[project]
name = "{{project}}"
version = "0.1.0"
description = "A Bittensor subnet scaffolded by Preflight"
requires-python = ">=3.13"
dependencies = ["bittensor>=11.3,<12", "fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["{{package}}"]
